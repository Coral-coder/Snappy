name: Snappy
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

targets:
  Snappy:
    type: application
    platform: iOS
    sources:
      - path: Snappy
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Snappy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: >-
          Snappy needs the camera to show the live viewfinder and apply filters.
          Nothing leaves your device unless you choose to share it.
        NSMicrophoneUsageDescription: >-
          Snappy uses the microphone only while you are recording a video.
        NSPhotoLibraryAddUsageDescription: >-
          Snappy saves the photos and videos you capture to your photo library when you ask it to.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SNAPPY_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(SNAPPY_TEAM_ID)
        CODE_SIGN_STYLE: $(SNAPPY_CODE_SIGN_STYLE)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(SNAPPY_EXTRA_SWIFT_FLAGS)

  SnappyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SnappyTests
    dependencies:
      - target: Snappy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SNAPPY_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Snappy:
    build:
      targets:
        Snappy: all
        SnappyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SnappyTests
    archive:
      config: Release
