name: Pages

# Publishes the web app to GitHub Pages. Every push that touches web/ redeploys,
# so the home-screen app picks up the new build the next time it is opened.
#
# Pages must be turned on once by a repository admin — the workflow token is not
# allowed to create a Pages site ("Resource not accessible by integration"), so
# this cannot be automated. Settings → Pages → Source. Either choice works:
#
#   "Deploy from a branch" → gh-pages / (root)   ← served by the branch push below
#   "GitHub Actions"                             ← served by the deployment below
#
# The job publishes both ways, so whichever source is selected, the site is
# live. The path that does not match the configured source fails harmlessly.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
      - 'scripts/check_web.mjs'
      - 'scripts/test_shaders.mjs'
      - 'scripts/test_app.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Test & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the app shell holds together
        run: node scripts/check_web.mjs

      - name: Install a browser to test against
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Compile every lens shader
        # A lens that will not compile is a black viewfinder on a phone, so this
        # gates the deploy rather than being discovered after it.
        run: node scripts/test_shaders.mjs

      - name: Drive the app with a fake camera
        run: node scripts/test_app.mjs

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -a web/. site/
          # Pages runs Jekyll by default, which would ignore files like _*.
          touch site/.nojekyll
          # Changing the service worker's cache name is what makes a returning
          # phone pick up this build instead of serving the old one forever.
          sed -i "s/const VERSION = 'snappy-v1';/const VERSION = 'snappy-${GITHUB_SHA::12}';/" site/sw.js
          grep -n "const VERSION" site/sw.js

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::12}"
          # The deploy branch is a snapshot, not history: one commit, force-pushed.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages

      # Second route: the Pages deployment API. This only works once Pages is set
      # to "GitHub Actions" as its source, so every step of it is allowed to fail
      # without failing the job — the branch push above has already published.
      - name: Configure Pages (only works on the GitHub Actions source)
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy through the Pages API
        id: deploy
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Where it lives
        run: |
          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          {
            echo "### Snappy web app"
            echo ""
            echo "$URL"
            echo ""
            echo "Open that in Safari on the iPhone, then Share → Add to Home Screen."
            echo ""
            echo "Branch deploy: pushed gh-pages (${GITHUB_SHA::12})."
            echo "Pages API deploy: ${{ steps.pages.outcome == 'success' && 'attempted' || 'skipped — source is not GitHub Actions' }}"
            echo ""
            echo "404? Pages is not enabled yet. Settings → Pages → Source →"
            echo "\"Deploy from a branch\" → gh-pages → / (root) → Save. One time only."
          } >> "$GITHUB_STEP_SUMMARY"
